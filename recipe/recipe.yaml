schema_version: 1

context:
  name: aio-pika
  version: "10.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4849fa2b6404a3a5ebb1dc07237160e6b5d4323170075bbd43aa7c8df0ed8275

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.26,<0.12
  run:
    - python >=${{ python_min }}
    - aiormq >=7.1.3,<8
    - yarl

tests:
  - python:
      imports:
        - aio_pika
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: aio-pika is a pure python AMQP client library
  description: |
    aio-pika is a pure python AMQP client library
  homepage: https://github.com/mosquito/aio-pika
  repository: https://github.com/mosquito/aio-pika
  documentation: https://github.com/mosquito/aio-pika

extra:
  recipe-maintainers:
    - akrherz
    - gregfreeman
